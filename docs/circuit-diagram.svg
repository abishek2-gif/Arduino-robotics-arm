<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc"><title id="title">Arduino Uno robotic arm wiring</title><desc id="desc">Joysticks connect to A0 through A3 and Uno 5V and ground. Servo signals connect to D3 D5 D6 D9. Servo power uses a separate rated supply with common ground.</desc><rect width="1120" height="790" fill="#f5f8fc"/><g font-family="Arial,sans-serif"><text x="35" y="45" font-size="26" fill="#15263c">ARDUINO ROBOTIC ARM • CONNECTION GUIDE</text><text x="35" y="77" font-size="16" fill="#15263c">Signal map and separate power rails. Verify actual servo connector pinouts.</text><rect x="380" y="110" width="290" height="345" rx="15" fill="#dce9fb" stroke="#376da6"/><text x="455" y="145" font-size="20" fill="#15263c">ARDUINO UNO</text><text x="35" y="200" font-size="17" fill="#15263c">Joystick 1 VRx</text><path d="M210 195H380" stroke="#2563eb" stroke-width="3" fill="none"/><text x="397" y="200" font-size="17" fill="#15263c">A0</text><text x="612" y="200" font-size="17" fill="#15263c">D3</text><path d="M670 195H860" stroke="#2563eb" stroke-width="3" fill="none"/><text x="880" y="200" font-size="17" fill="#15263c">Base signal</text><text x="35" y="264" font-size="17" fill="#15263c">Joystick 1 VRy</text><path d="M210 259H380" stroke="#2563eb" stroke-width="3" fill="none"/><text x="397" y="264" font-size="17" fill="#15263c">A1</text><text x="612" y="264" font-size="17" fill="#15263c">D5</text><path d="M670 259H860" stroke="#2563eb" stroke-width="3" fill="none"/><text x="880" y="264" font-size="17" fill="#15263c">Shoulder signal</text><text x="35" y="328" font-size="17" fill="#15263c">Joystick 2 VRx</text><path d="M210 323H380" stroke="#2563eb" stroke-width="3" fill="none"/><text x="397" y="328" font-size="17" fill="#15263c">A2</text><text x="612" y="328" font-size="17" fill="#15263c">D6</text><path d="M670 323H860" stroke="#2563eb" stroke-width="3" fill="none"/><text x="880" y="328" font-size="17" fill="#15263c">Elbow signal</text><text x="35" y="392" font-size="17" fill="#15263c">Joystick 2 VRy</text><path d="M210 387H380" stroke="#2563eb" stroke-width="3" fill="none"/><text x="397" y="392" font-size="17" fill="#15263c">A3</text><text x="612" y="392" font-size="17" fill="#15263c">D9</text><path d="M670 387H860" stroke="#2563eb" stroke-width="3" fill="none"/><text x="880" y="392" font-size="17" fill="#15263c">Gripper signal</text><text x="35" y="486" font-size="21" fill="#15263c">POWER CONNECTIONS</text><text x="35" y="525" font-size="16" fill="#15263c">Computer USB</text><path d="M275 520H370" stroke="#496887" stroke-width="3" fill="none"/><text x="390" y="525" font-size="16" fill="#15263c">Uno USB — board power</text><text x="35" y="574" font-size="16" fill="#15263c">Uno 5V</text><path d="M275 569H370" stroke="#dc2626" stroke-width="3" fill="none"/><text x="390" y="574" font-size="16" fill="#15263c">Both joystick VCC pins (5V-compatible modules)</text><text x="35" y="623" font-size="16" fill="#15263c">External supply +</text><path d="M275 618H370" stroke="#dc2626" stroke-width="3" fill="none"/><text x="390" y="623" font-size="16" fill="#15263c">All four servo positive pins — rated voltage only</text><text x="35" y="672" font-size="16" fill="#15263c">External supply − / GND</text><path d="M275 667H370" stroke="#15263c" stroke-width="3" fill="none"/><text x="390" y="672" font-size="16" fill="#15263c">All servo GND + Uno GND + both joystick GND</text><text x="35" y="728" font-size="16" fill="#15263c">Do not join external supply + to Uno 5V or VIN. Joystick SW pins are unused.</text><text x="35" y="758" font-size="16" fill="#15263c">Servo models, supply rating and joint limits remain to be selected and calibrated.</text></g></svg>